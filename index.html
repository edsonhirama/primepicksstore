<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrimePicks Store</title>

  <!-- ClickFast Ads Tracker -->
  <script>
    const script = document.createElement("script");
    script.src = "https://app.clickfastads.com.br/api/tracker/external/conversions?referer=" + encodeURIComponent(window.location.href);
    document.head.appendChild(script);
  </script>
  <script src="https://app.clickfastads.com.br/api/tracker/external/visits"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b0f19;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .container {
      max-width: 600px;
      width: 100%;
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .card {
      background: #131b2e;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    .page-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    .page-link:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
      transform: translateY(-2px);
    }
    footer {
      margin-top: 3rem;
      font-size: 0.85rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>PrimePicks Store</h1>
    <p>Hub de páginas estáticas e avaliações independentes de produtos.</p>
    
    <div class="card">
      <a href="/derila-ergo/" class="page-link">
        <span>Acessar /derila-ergo/</span>
        <span>&rarr;</span>
      </a>
    </div>

    <footer>
      &copy; 2026 PrimePicks Store. Hospedado via Cloudflare Pages.
    </footer>
  </div>
</body>
</html>
